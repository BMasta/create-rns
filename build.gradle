plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
}

def kubejsGameTestPath = 'com/bmaster/createrns/compat/kubejs/**'
def gameTestSourceSet = sourceSets.create('gameTest') {
    java.exclude kubejsGameTestPath
}
def kubejsGameTestSourceSet = sourceSets.create('kubejsGameTest') {
    java {
        srcDir 'src/gameTest/java'
        include kubejsGameTestPath
    }
}
def kubejsGameTestRuntimeEnabled = providers.provider {
    configurations.getByName(kubejsGameTestSourceSet.runtimeOnlyConfigurationName).allDependencies.any {
        it.group == 'dev.latvian.mods' && it.name == 'kubejs-neoforge'
    }
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://chocolateminecraft.com/maven" } // Xaero's Minimap / World Map
    maven { url = 'https://www.cursemaven.com' }
    maven { url = "https://api.modrinth.com/maven" } // Jade
    maven { url = "https://maven.terraformersmc.com/" } // EMI
    maven {
        url = "https://maven.latvian.dev/releases" // KubeJS
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.rtyley"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Keep test classes out of normal launches and assemble the appropriate mod sources for GameTest runs.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_game_tests" {
            sourceSet(sourceSets.main)
            sourceSet(gameTestSourceSet)
        }
        "${mod_id}_kubejs_game_tests" {
            sourceSet(sourceSets.main)
            sourceSet(gameTestSourceSet)
            sourceSet(kubejsGameTestSourceSet)
        }
    }

    def mainMod = mods.getByName(project.mod_id)
    def gameTestMod = mods.getByName("${project.mod_id}_game_tests")
    def kubejsGameTestMod = mods.getByName("${project.mod_id}_kubejs_game_tests")

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            loadedMods = [mainMod]
        }

        server {
            server()
            loadedMods = [mainMod]
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = kubejsGameTestRuntimeEnabled.map {
                it ? kubejsGameTestSourceSet : gameTestSourceSet
            }
            loadedMods = kubejsGameTestRuntimeEnabled.map {
                [it ? kubejsGameTestMod : gameTestMod] as Set
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        tasks.named("runGameTestServer", JavaExec) {
            jvmArgs "-ea"
        }

        data {
            data()
            loadedMods = [mainMod]

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.TRACE
        }
    }

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.gameTest.compileClasspath += sourceSets.main.output
sourceSets.gameTest.runtimeClasspath += sourceSets.main.output
sourceSets.kubejsGameTest.compileClasspath += sourceSets.main.output + sourceSets.gameTest.output
sourceSets.kubejsGameTest.runtimeClasspath += sourceSets.main.output + sourceSets.gameTest.output

neoForge.addModdingDependenciesTo(gameTestSourceSet)
neoForge.addModdingDependenciesTo(kubejsGameTestSourceSet)

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    sableCompileContainer
    named(gameTestSourceSet.implementationConfigurationName) {
        extendsFrom implementation
    }
    named(gameTestSourceSet.compileOnlyConfigurationName) {
        extendsFrom compileOnly
    }
    named(gameTestSourceSet.runtimeOnlyConfigurationName) {
        extendsFrom runtimeOnly, localRuntime
    }
    named(kubejsGameTestSourceSet.implementationConfigurationName) {
        extendsFrom implementation
    }
    named(kubejsGameTestSourceSet.compileOnlyConfigurationName) {
        extendsFrom compileOnly
    }
    named(kubejsGameTestSourceSet.runtimeOnlyConfigurationName) {
        extendsFrom runtimeOnly, localRuntime
    }
}

def sableCompanionJarName = "sable-companion-common.jar"
def sableCompanionApiDir = layout.buildDirectory.dir("generated/sableCompanionApi")
def sableCompanionApiJar = sableCompanionApiDir.map { it.file(sableCompanionJarName) }
def extractSableCompanionApi = tasks.register("extractSableCompanionApi", Sync) {
    from({ zipTree(configurations.sableCompileContainer.singleFile) }) {
        include "META-INF/jarjar/sable-companion-common-${minecraft_version}-*.jar"
        eachFile { details ->
            details.name = sableCompanionJarName
            details.path = details.name
        }
        includeEmptyDirs = false
    }
    into sableCompanionApiDir
    outputs.file sableCompanionApiJar
}

dependencies {
    sableCompileContainer("maven.modrinth:sable:${sable_version}+mc1.21.1")

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    compileOnly("maven.modrinth:jade:${jade_version}+neoforge")
    compileOnly("info.journeymap:journeymap-api-neoforge:${journeymap_api_version}")
    compileOnly("xaero.map:xaeroworldmap-neoforge-${minecraft_version}:${xaero_worldmap_version}")
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
    compileOnly("maven.modrinth:create-aeronautics:${create_aeronautics_version}+mc1.21.1")
    compileOnly("maven.modrinth:sable:${sable_version}+mc1.21.1")
    compileOnly(files(sableCompanionApiJar).builtBy(extractSableCompanionApi))

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
//    localRuntime("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")
    localRuntime("maven.modrinth:jade:${jade_version}+neoforge")
    localRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")
    localRuntime("maven.modrinth:create-aeronautics:${create_aeronautics_version}+mc1.21.1")
    localRuntime("maven.modrinth:sable:${sable_version}+mc1.21.1")
//    localRuntime("maven.modrinth:7pCNymxz:${oei_version}") // One Enough Item
//    localRuntime("maven.modrinth:7ODqOXka:${oelib_version}") // OELib

    localRuntime("maven.modrinth:journeymap:${journeymap_version}+neoforge")
    localRuntime("xaero.minimap:xaerominimap-neoforge-${minecraft_version}:${xaero_minimap_version}")
    localRuntime("xaero.map:xaeroworldmap-neoforge-${minecraft_version}:${xaero_worldmap_version}")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            jei_version            : jei_version,
            emi_version            : emi_version,
            jade_version           : jade_version,
            kubejs_version         : kubejs_version,
            sable_version          : sable_version,
            xaero_worldmap_version : xaero_worldmap_version,
            xaero_minimap_version  : xaero_minimap_version,
            journeymap_api_version : journeymap_api_version,
            journeymap_version     : journeymap_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def dynamicDatapackDumpDir = layout.projectDirectory.dir("src/generated/builtin_packs")
def dynamicDatapackDumpWorkDir = layout.buildDirectory.dir("tmp/dynamic_datapack_dump")

tasks.register('cleanDynamicDatapackDump') {
    doLast {
        def dumpRoot = dynamicDatapackDumpDir.asFile
        if (!dumpRoot.exists()) return

        dumpRoot.listFiles()?.each { file ->
            if (file.name == 'README.md') return

            if (file.isDirectory()) {
                if (!file.deleteDir()) {
                    throw new GradleException("Failed to delete dynamic datapack dump directory: ${file}")
                }
            } else if (!file.delete()) {
                throw new GradleException("Failed to delete dynamic datapack dump file: ${file}")
            }
        }
    }
}

tasks.register('dumpDynamicDatapacks', JavaExec) {
    group = 'create-rns'
    description = 'Dumps in-memory dynamic datapack content to disk for inspection.'
    dependsOn tasks.named('classes')
    dependsOn tasks.named('cleanDynamicDatapackDump')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.bmaster.createrns.data.pack.DynamicDatapackDumpTool'
    workingDir = dynamicDatapackDumpWorkDir.get().asFile
    doFirst {
        workingDir.mkdirs()
    }
    args dynamicDatapackDumpDir.asFile.absolutePath
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
